import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def formattedDate = new Date().format('MM.dd.yyyy')
def appVersionCode = 1
def appVersionName = "0.0.1"

base {
    archivesName = "D514_MoneyManager_v${appVersionName}_(${appVersionCode})_${formattedDate}"
}

android {
    namespace 'com.money.tracker.budget.planner.moneymanager'
    compileSdk 37

    defaultConfig {
        applicationId "com.money.tracker.budget.planner.moneymanager"
        minSdk 24
        //noinspection EditedTargetSdkVersion
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        bundle {
            language {
                enableSplit = false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
        freeCompilerArgs.add('-Xskip-metadata-version-check')
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.google.firebase:firebase-auth:25.0.0'
    implementation('com.github.midorikocak:currency-picker-android:1.2.1') {
        exclude group: 'com.android.support'
    }
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.airbnb.android:lottie:6.5.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'com.intuit.ssp:ssp-android:1.1.0'

    implementation 'org.greenrobot:eventbus:3.2.0'

    // Ads SDK (GMA Next-Gen) + Mediation
    implementation 'com.cscapp:library-gma:0.0.9'
    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'
    implementation 'com.google.ads.mediation:facebook:6.22.0.0'
    implementation 'com.google.ads.mediation:applovin:13.6.4.0'
    implementation 'com.google.ads.mediation:inmobi:11.4.0.0'
    implementation 'com.google.ads.mediation:pangle:8.2.0.4.0'
    implementation 'com.google.ads.mediation:mintegral:17.1.71.0'
    implementation 'com.unity3d.ads:unity-ads:4.20.0'
    implementation 'com.google.ads.mediation:unity:4.19.0.1'
    implementation 'com.pubscale.ads:admob-adapter:1.0.5'

    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-config'
    implementation 'io.ak1:bubbletabbar:1.0.8'

}

configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-base'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
}